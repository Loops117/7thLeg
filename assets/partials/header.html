<!-- Notifications Bell Mount (DIAG) -->
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  import { mountHeaderBell } from '/assets/js/header-bell.debug.js?v=diag1';

  const supabase = window.supabase || (
    (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) ? createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null
  );

  function ready(fn){ document.readyState !== 'loading' ? fn() : document.addEventListener('DOMContentLoaded', fn); }

  async function mountNow() {
    try {
      const client = window.supabase || supabase;
      if (!client) return;
      await mountHeaderBell({ supabase: client, containerSelector: '#notif-bell-mount', position: 'append' });
    } catch (e) {
      console.error('[notifications-bell] mount failed:', e);
    }
  }

  if (supabase || window.supabase) { ready(mountNow); }
  else { window.addEventListener('supabase-ready', () => ready(mountNow), { once: true }); }
</script>
