<style>
  /* Market card description behavior */
  .market-card { transition: transform .12s ease, box-shadow .12s ease; overflow: visible; }
  .market-card:hover { z-index: 5; transform: translateY(-2px); }
  .market-card .market-desc { max-height: 3.6em; overflow: hidden; transition: max-height .18s ease; }
  /* default: short preview; hover: expands a bit but still capped */
  .market-card:hover .market-desc { max-height: 3.6em; }

  /* "See more" link only shows when content is truncated */
  .market-see-more { display: none; }
  .market-desc.is-truncated + .market-see-more { display: inline-block; }
  .market-card .market-desc p { margin-bottom: .5rem; }
</style>

<div class="container-fluid py-3">
<div class="row">
<!-- Filters Sidebar -->
<aside class="col-12 col-md-3 col-lg-2 mb-3">
<div class="card shadow-sm">
<div class="card-body">
<h6 class="mb-3">Filters</h6>
<div class="mb-3">
<label class="form-label mb-1">Item Type</label>
<div aria-label="Type filter" class="btn-group w-100" role="group">
<input checked="" class="btn-check" id="type-all" name="typeFilter" type="radio" value="all"/>
<label class="btn btn-outline-secondary btn-sm" for="type-all">All</label>
<input class="btn-check" id="type-live" name="typeFilter" type="radio" value="live"/>
<label class="btn btn-outline-secondary btn-sm" for="type-live">Live</label>
<input class="btn-check" id="type-drygood" name="typeFilter" type="radio" value="drygood"/>
<label class="btn btn-outline-secondary btn-sm" for="type-drygood">Dry Goods</label>
</div>
</div>
<div class="mb-2">
<label class="form-label mb-1">Stores</label>
<div class="list-group small" id="store-filter-list" style="max-height: 300px; overflow:auto;">
<!-- populated by JS -->
</div>
<div class="form-text" id="store-filter-status"></div>
</div>
</div>
</div>
</aside>
<!-- Main Content -->
<main class="col-12 col-md-9 col-lg-10">
<div class="d-flex align-items-center gap-2 mb-3">
<div class="flex-grow-1">
<input autocomplete="off" class="form-control" id="market-search" placeholder="Search species or item name…" type="search"/>
</div>
<button class="btn btn-outline-secondary" id="market-clear">Clear</button>
</div>
<div class="mb-2 text-muted small" id="market-status"></div>
<div class="row g-3" id="market-grid">
<!-- cards -->
</div>
</main>
</div>
</div>
